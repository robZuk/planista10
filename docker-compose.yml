# Srodowisko DEWELOPERSKIE — kompletne i samodzielne.
#   make dev   albo   docker compose up
# Hot-reload: kod montowany z dysku, backend tsx watch, frontend Vite HMR.
# (Wariant produkcyjny jest w osobnym, tez kompletnym pliku: docker-compose.prod.yml)
name: planista10

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planista10
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      # Seed przy pierwszym starcie (db/README.md); PLANISTA_SEED=0 — pusta baza (CI E2E).
      PLANISTA_SEED: ${PLANISTA_SEED:-1}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Seed: przy PIERWSZYM starcie (pusty wolumen pgdata) baza planista10 wypelnia sie zrzutem
      # db/planista10-dump.sql.gz (skrypt db/initdb/10-seed.sh). Istniejacy wolumen — bez zmian.
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
      - ./db/planista10-dump.sql.gz:/seed/planista10-dump.sql.gz:ro
    # Baza tylko w sieci wewnetrznej (internal: true) — niedostepna z internetu ani dla frontu.
    networks:
      - internal
    healthcheck:
      # Po TCP: w czasie wgrywania seedu Postgres slucha tylko na gniezdzie, wiec backend czeka,
      # az baza bedzie gotowa naprawde. start_period — czas na wgranie zrzutu przy pierwszym starcie.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d planista10']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 120s

  backend:
    image: planista10-backend-dev
    build:
      context: ./backend
      target: dev
    # Klient Prisma z aktualnego schematu (obraz moze byc starszy niz kod) i migracje przed startem.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    environment:
      PORT: 4004
      # PLANISTA_DB=planista10_pelne docker compose up -d backend -> pelna baza testowa (scripts/pelne-dane)
      DATABASE_URL: postgresql://postgres:password@db:5432/${PLANISTA_DB:-planista10}?schema=public
      # Sekrety deweloperskie — jawne, bo to tylko lokalne srodowisko.
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      CORS_ORIGIN: http://localhost:5177
    volumes:
      # Kod z dysku -> hot-reload; anonimowy wolumen chroni node_modules z obrazu.
      - ./backend:/app
      - /app/node_modules
    networks:
      - internal
      - edge
    ports:
      # Bind na localhost — nie wystawiamy dev na LAN.
      - '127.0.0.1:4004:4004'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: planista10-frontend-dev
    build:
      context: ./frontend
      target: dev
    command: npm run dev -- --host
    environment:
      # Vite proxuje /api na kontener backendu (nazwa uslugi w sieci compose).
      VITE_PROXY_TARGET: http://backend:4004
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - edge
    ports:
      - '127.0.0.1:5177:5177'
    depends_on:
      - backend

volumes:
  pgdata:

networks:
  # Warstwa brzegowa: front <-> backend.
  edge:
  # Warstwa wewnetrzna: backend <-> baza. internal: true = brak trasy do internetu.
  internal:
    internal: true
